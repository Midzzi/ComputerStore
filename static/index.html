<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Computer Store — Static Preview</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo">ComputerStore</h1>
      <nav>
        <a href="#">Home</a>
        <a href="#products">Products</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h2>Premium computers & accessories</h2>
        <p>Shop curated gaming and productivity hardware.</p>
        <a class="btn" href="#products">View products</a>
      </div>
    </section>

    <section id="products" class="products container">
      <h3>Featured products</h3>
      <div class="grid" id="productGrid">
        <!-- products injected by JS -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© ComputerStore — static preview</p>
    </div>
  </footer>

  <script src="scripts.js"></script>
</body>
</html>
